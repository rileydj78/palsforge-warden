name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Test
        run: go test ./...
      - name: Panel script is valid JavaScript
        run: node --check internal/web/static/app.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VER="0.0.0-${GITHUB_SHA::7}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/warden.exe ./cmd/warden
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/warden-linux-amd64 ./cmd/warden
      # The unsigned Windows build. Once SignPath Foundation approves the project, a signing step
      # (signpath/github-action-submit-signing-request) is added here and the signed warden.exe is
      # what gets released.
      - uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: warden-unsigned
          path: dist/
