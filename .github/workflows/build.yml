name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Test
        run: go test ./...
      - name: Panel script is valid JavaScript
        run: node --check internal/web/static/app.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VER="0.0.0-${GITHUB_SHA::7}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/warden.exe ./cmd/warden
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/warden-linux-amd64 ./cmd/warden
      # The unsigned Windows build. Once SignPath Foundation approves the project, a signing step
      # (signpath/github-action-submit-signing-request) is added here and the signed warden.exe is
      # what gets released.
      - uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: warden-unsigned
          path: dist/

  # A version tag (v1.0.0-rc.1, v1.0.0...) makes a DRAFT release with the builds and their
  # checksums. Nothing is public until a maintainer reviews the draft and publishes it.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: warden-unsigned
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum warden.exe warden-linux-amd64 > SHA256SUMS && cd ..
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="## $VER" '$0 ~ "^## " {p = ($0 ~ v)} p' CHANGELOG.md > notes.md
          PRE=""; case "$VER" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/warden.exe dist/warden-linux-amd64 dist/SHA256SUMS \
            --draft $PRE --title "Palsforge Warden $VER" --notes-file notes.md
